<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Matematik &amp; glass!</title>
        <link href="https://fonts.googleapis.com/css?family=Muli:300" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Herr+Von+Muellerhoff" rel="stylesheet">
        <link rel="stylesheet" media="all and (max-device-width: 480px)" href="iphone.css">
        <meta name="color-scheme" content="light dark">
        <style type="text/css">@import url(http://fonts.googleapis.com/css?family=Source+Sans+Pro);

        :root {
            color-scheme: light dark;
            --bg: white;
            --fg: black;
            --line: black;
            --answer-line: #999;
            --muted: #ccc;
            --input-border: #ccc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1b1d;
                --fg: #e6e6e6;
                --line: #e6e6e6;
                --answer-line: #777;
                --muted: #666;
                --input-border: #555;
            }
        }

        html, head, body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Source Sans Pro', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .top {
            font-family: 'Muli', sans-serif;
        }

        h1 {
            font-size: 60px;
        }

        .buttons {
            text-align: right;
        }

        button {
            cursor: pointer;
            font-size: 20px;
            border: 0 solid #ddd;
            border-radius: 4px;
            background: var(--bg);
            color: var(--muted);
        }

        .range-settings .slider {
            width: 400px;
        }

        .range-settings .range-value {
            width: 5em;
            font: inherit;
            font-size: 1rem;
            padding: 0.1rem 0.3rem;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--fg);
        }

        .problem {
            display: inline-block;
            padding: 1rem;
            text-align: right;
        }

        .addition,
        .subtraction {
            padding-bottom: 4rem;
            padding-right: 2rem;
        }

        .long-division-sv {
            padding-bottom: 10rem;
        }

        .long-division-sv .both {
            border-top: 1px solid var(--line);
        }

        .long-division-sv .a {
            padding-right: 0.5rem;
            padding-left: 0.2rem;
        }

        .long-division-sv .b {
            border-bottom: 0;
            border-left: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding-left: 0.2rem;
            padding-right: 0.2rem;
        }

        .long-division-us {
            padding-bottom: 10rem;
        }

        .long-division-us .both {
        }

        .long-division-us .a {
            border-top: 1px solid var(--line);
            padding-right: 0.5rem;
            padding-left: 0.2rem;
        }

        .long-division-us .b {
            border-bottom: 0;
        }

        .multiplication,
        .division {
            padding-right: 8rem;
        }

        .a {
            width: 100%;
        }

        .b {
            width: 100%;
            border-bottom: 1px solid var(--line);
        }

        .table-picker label,
        .style-picker label {
            display: inline-block;
            margin: 0.5rem 0.75rem 1rem 0;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .tables {
            max-width: 19cm;
            text-align: center;
        }

        .times-table {
            display: inline-table;
            border-collapse: collapse;
            margin: 0 0.6cm 1cm 0.6cm;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 1.4rem;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .times-table td {
            height: 0.95cm;
            padding: 0 0.2rem;
            vertical-align: bottom;
        }

        .times-table td.n {
            text-align: right;
        }

        .times-table td.k {
            text-align: left;
        }

        .times-table td.answer {
            width: 1.8cm;
            border-bottom: 1px solid var(--answer-line);
        }

        .times-list {
            width: 19cm;
            column-count: 3;
            column-gap: 1.2cm;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 1.4rem;
        }

        .times-row {
            display: flex;
            align-items: flex-end;
            height: 0.95cm;
            break-inside: avoid;
        }

        .times-row span {
            padding: 0 0.2rem;
        }

        .times-row .n {
            width: 1.4em;
            text-align: right;
        }

        .times-row .k {
            width: 1.4em;
            text-align: left;
        }

        .times-row .answer {
            width: 1.8cm;
            height: 100%;
            border-bottom: 1px solid var(--answer-line);
        }

        @media print {
            @page {
                margin: 1.5cm 1cm;
            }

            :root {
                color-scheme: light;
                --bg: white;
                --fg: black;
                --line: black;
                --answer-line: #999;
            }

            html, body {
                display: block;
            }

            .no-print {
                display: none;
            }
        }

        </style>
    </head>
    <body>
        <div id="main">
        </div>
    </body>

    <script src="matematik.js" charset="utf-8"></script>
    <noscript>
    </noscript>

    <script>
        var app = Elm.Matematik.init({node: document.getElementById('main'), flags: {language: navigator.language, query: location.search}});
        app.ports.setQuery.subscribe(function (query) {
            history.replaceState(null, '', location.pathname + '?' + query + location.hash);
        });
    </script>

</html>
